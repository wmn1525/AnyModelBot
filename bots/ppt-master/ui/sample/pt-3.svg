<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect width="1280" height="720" fill="#FFFFFF"/><text x="80" y="104" font-size="44" font-weight="700" fill="#1B2430" text-anchor="start">Projetores bons raramente são práticos</text><rect x="80" y="128" width="72" height="6" rx="3" fill="#D9601A"/><text x="1200" y="672" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="end">3</text><rect x="80" y="200" width="352" height="340" rx="14" fill="#F2F4F7"/><text x="112" y="310" font-size="76" font-weight="700" fill="#D9601A" text-anchor="start">78%</text><text x="112" y="390" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">acham o seu pesado</text><text x="112" y="430" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">demais para carregar</text><rect x="464" y="200" width="352" height="340" rx="14" fill="#F2F4F7"/><text x="496" y="310" font-size="76" font-weight="700" fill="#D9601A" text-anchor="start">6 min</text><text x="496" y="390" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">tempo médio entre</text><text x="496" y="430" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">ligar e focar</text><rect x="848" y="200" width="352" height="340" rx="14" fill="#F2F4F7"/><text x="880" y="310" font-size="76" font-weight="700" fill="#D9601A" text-anchor="start">41%</text><text x="880" y="390" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">dos projetores de casa:</text><text x="880" y="430" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">menos de 10 usos/ano</text><text x="80" y="610" font-size="24" font-weight="400" fill="#5F6B7A" text-anchor="start">Fonte: pesquisa com usuários, junho de 2026, n=1.200</text></svg>
